version: '3.8'

services:
  # Redis para cache y sesiones
  redis:
    image: redis:7-alpine
    container_name: lab_clinic_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - lab_clinic_network

  # Aplicación Django (imagen de Docker Hub)
  web:
    image: josedaniel001/lab-clinic-backend:latest  # Cambiar por tu imagen de Docker Hub
    container_name: lab_clinic_web
    restart: unless-stopped
    environment:
      # Django settings
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-change-in-production}
      DJANGO_SETTINGS_MODULE: config.settings
      
      # Database settings
      DATABASE_URL: ${DATABASE_URL:-postgresql://labuser:labpass@host.docker.internal:5432/labdb}
      
      # Redis settings
      REDIS_URL: redis://redis:6379/0
      
      # CORS settings
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://bioanalisis.com,http://www.bioanalisis.com,http://bioanalisisadmin.com,http://www.bioanalisisadmin.com}
      
      # Media and static files
      MEDIA_ROOT: /app/media
      STATIC_ROOT: /app/staticfiles
      
      # Timezone
      TIME_ZONE: ${TIME_ZONE:-America/Guatemala}
      
      # JWT settings
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-jwt-secret-key-change-in-production}
      JWT_ACCESS_TOKEN_LIFETIME: ${JWT_ACCESS_TOKEN_LIFETIME:-5}
      JWT_REFRESH_TOKEN_LIFETIME: ${JWT_REFRESH_TOKEN_LIFETIME:-1}
      
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      - redis
    networks:
      - lab_clinic_network
    command: >
      sh -c "python manage.py migrate &&
              python manage.py collectstatic --noinput &&
              gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 config.wsgi:application"

  # Nginx con SSL
  nginx:
    image: nginx:alpine
    container_name: lab_clinic_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
      - ${STATIC_PATH:-./staticfiles}:/app/staticfiles
      - ${MEDIA_PATH:-./media}:/app/media
    depends_on:
      - web
    networks:
      - lab_clinic_network

networks:
  lab_clinic_network:
    driver: bridge
